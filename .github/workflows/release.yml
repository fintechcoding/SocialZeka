# Turns a tag into a published release.
#
#     git tag v1.2.0 && git push origin v1.2.0
#
# and everything else happens here: build, test, installer, checksums, release. The version reaches
# the assembly and the installer from the tag alone, so the three can no longer disagree — which
# they could, and did, when it was written out by hand in each place.
#
# The tests run before anything is published. A release that fails its own suite is worse than a
# late release: the application checks for updates and will offer it to everybody.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (v olmadan, örn. 1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Sürümü etiketten oku
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ github.event.inputs.version }}"
          } else {
            "${{ github.ref_name }}" -replace '^v', ''
          }

          if (-not $version) { throw "Surum belirlenemedi." }

          # A pre-release tag (v1.2.0-rc.1) is published as a pre-release, so /releases/latest
          # skips it and nobody is pushed a candidate they did not ask for.
          $prerelease = if ($version -match '-') { "true" } else { "false" }

          "version=$version"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "Surum: $version (on surum: $prerelease)"

      - name: Derle
        run: dotnet build VoiceTranscript.slnx -c Release --nologo -p:VersionPrefix=${{ steps.version.outputs.version }}

      # Before anything is published. See the note in ci.yml about why this is not `dotnet test`.
      - name: Testler
        shell: pwsh
        run: |
          $module = "tests/VoiceTranscript.Tests/bin/Release/net10.0-windows10.0.19041.0/VoiceTranscript.Tests.exe"
          if (-not (Test-Path $module)) { throw "Test modulu uretilmedi: $module" }
          & $module
          if ($LASTEXITCODE -ne 0) { throw "Testler basarisiz; yayin yapilmadi." }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # numpy alongside pytest, because vt_worker.speaker computes its filterbank with it. The
      # rest of the pinned runtime is deliberately absent — see the same step in ci.yml. This file
      # was missed when that one was updated, and the release that followed failed here rather
      # than shipping, which is the failure working as intended.
      - name: Python testleri
        run: |
          python -m pip install --quiet --upgrade pip pytest numpy
          python -m pytest worker/tests -q

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      # -RequireInstaller so a missing Inno Setup fails the job rather than quietly publishing a
      # release whose only artefact is a folder nobody can install.
      - name: Paketle
        shell: pwsh
        run: ./publish.ps1 -Version ${{ steps.version.outputs.version }} -RequireInstaller

      - name: Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/SocialZeka-Setup-${{ steps.version.outputs.version }}-win-x64.exe
            dist/SHA256SUMS
