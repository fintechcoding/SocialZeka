# Builds and tests every push.
#
# Windows, and not by preference: the capture layer is WASAPI, the worker host uses Win32 job
# objects, and the test suite constructs real WPF windows to catch the class of fault that compiles
# cleanly and throws when a screen is opened. None of that runs anywhere else.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Bağımlılıkları getir
        run: dotnet restore VoiceTranscript.slnx

      - name: Derle
        run: dotnet build VoiceTranscript.slnx -c Release --no-restore --nologo

      # Deliberately not `dotnet test`.
      #
      # On the .NET 10 SDK the old VSTest bridge is gone, and with the Microsoft.Testing.Platform
      # runner a net10.0-windows target reports "Zero tests ran" — with exit code zero. A CI step
      # that runs no tests and passes is worse than no CI step at all, because it is believed.
      # Both documented opt-ins were tried and neither works; see docs/GELISTIRME.md.
      - name: C# testleri
        run: |
          $module = "tests/VoiceTranscript.Tests/bin/Release/net10.0-windows10.0.19041.0/VoiceTranscript.Tests.exe"
          if (-not (Test-Path $module)) { throw "Test modulu uretilmedi: $module" }
          & $module
          if ($LASTEXITCODE -ne 0) { throw "C# testleri basarisiz ($LASTEXITCODE)." }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The worker's own tests need the standard library, pytest, and numpy. The rest of the
      # pinned runtime — ctranslate2, faster-whisper, onnxruntime, cuBLAS — is a multi-gigabyte
      # install that no test here touches and that this runner has no GPU for anyway.
      #
      # numpy is the one exception because vt_worker.speaker computes its filterbank with it, and
      # the alternative was to skip those tests on a runner without it — which is the same as not
      # having them. It is a few megabytes and pure CPU.
      - name: Python testleri
        run: |
          python -m pip install --quiet --upgrade pip pytest numpy
          python -m pytest worker/tests -q
